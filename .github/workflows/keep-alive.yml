    # Her 10 dakikada bir çalışır
    - cron: '*/10 * * * *'
  workflow_dispatch: # İstediğinde manuel tetikleyebilmen için

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          curl -I -s https://praidbothosmix.onrender.com || exit 0
